<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#333" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Surveillance zone boundaries -->
  <rect x="100" y="100" width="600" height="400" fill="none" stroke="#0078d4" stroke-width="2" stroke-dasharray="10,5" opacity="0.7"/>
  
  <!-- Crosshairs in center -->
  <g stroke="#00ff00" stroke-width="2" opacity="0.8">
    <line x1="350" y1="300" x2="450" y2="300"/>
    <line x1="400" y1="250" x2="400" y2="350"/>
    <circle cx="400" cy="300" r="30" fill="none"/>
  </g>
  
  <!-- Zone labels -->
  <text x="120" y="130" fill="#0078d4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ZONE A</text>
  <text x="520" y="130" fill="#0078d4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ZONE B</text>
  <text x="120" y="470" fill="#0078d4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ZONE C</text>
  <text x="520" y="470" fill="#0078d4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ZONE D</text>
  
  <!-- Simulated people/objects -->
  <circle cx="200" cy="200" r="8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="250" cy="180" r="8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="220" cy="240" r="8" fill="#ff6b6b" opacity="0.8"/>
  
  <circle cx="580" cy="350" r="8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="600" cy="320" r="8" fill="#ff6b6b" opacity="0.8"/>
  
  <!-- Status overlay -->
  <rect x="20" y="20" width="200" height="80" fill="rgba(0,0,0,0.7)" rx="5"/>
  <text x="30" y="40" fill="#00ff00" font-family="Arial, sans-serif" font-size="12" font-weight="bold">SURVEILLANCE ACTIVE</text>
  <text x="30" y="60" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Detection Mode: AI Enhanced</text>
  <text x="30" y="80" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Status: Monitoring</text>
  
  <!-- Timestamp -->
  <rect x="600" y="20" width="180" height="40" fill="rgba(0,0,0,0.7)" rx="5"/>
  <text x="610" y="35" fill="#ffff00" font-family="Consolas, monospace" font-size="12" font-weight="bold">2025-01-24 07:40:04</text>
  <text x="610" y="50" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">GPS: 37.7749, -122.4194</text>
</svg>
